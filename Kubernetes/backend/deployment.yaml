apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: taskify
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::038686089624:role/sabeh-cluster-backend-irsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: taskify
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: ahmedsabeh/backend-app:1.3
          env:
            - name: DYNAMO_TABLE
              value: "sabeh-app-db" 
            - name: AWS_REGION
              value: "us-east-1"
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "100Mi"
              cpu: "128m"
            limits:
              memory: "200Mi"
              cpu: "256m"

